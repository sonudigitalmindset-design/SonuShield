name: "GO Linux Release"

on:
  push:
    branches:
      - "main"

jobs:
  pre-release:
    name: "Auto Release"
    runs-on: "ubuntu-24.04"
    permissions:
      contents: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: "Install dependencies"
        run: go mod download

      - name: "Generate random UUID"
        id: uuid
        run: echo "uuid=$(uuidgen)" >> $GITHUB_ENV

      - name: "Build with UUID"
        run: go build -ldflags "-X 'main.Fingerprint=${{ env.uuid }}'" -o dist/main

      - name: "Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          prerelease: true
          name: "Prerelease ${{ env.uuid }}"
          files: |
            dist/main
          body: |
            This is an automatic build that might have bugs.
            Release Tag: ${{ env.uuid }}
          generate_release_notes: true
