name: "CI"

# Build, vet, and config validation on every push and pull
# request to main. No secrets are needed: the workflow
# generates its own throwaway config and self-signed
# certificate, and the validator's backend probe runs against
# a local dummy listener. The checked-in examples/config.json
# is NOT used here: it carries placeholder secrets that the
# validator correctly rejects.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: "Build, vet, validate"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: "Install dependencies"
        run: go mod download

      - name: "Build"
        run: go build ./...

      - name: "Vet"
        run: go vet ./...

      - name: "Build validator binary"
        run: go build -o /tmp/sonushield .

      - name: "Generate throwaway config and certificate"
        run: |
          mkdir -p /tmp/ci-check
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ci-check/key.pem \
            -out /tmp/ci-check/cert.pem -days 2 -nodes \
            -subj "/CN=ci.example.com"
          cat > /tmp/ci-check/config.json <<'JSON'
          {
            "proxy": {
              "adminsecret": "ci-admin-secret-value",
              "apisecret": "ci-api-secret-value",
              "secrets": {
                "cookie": "ci-cookie-secret-value",
                "javascript": "ci-javascript-secret-value",
                "captcha": "ci-captcha-secret-value"
              }
            },
            "domains": [
              {
                "name": "ci.example.com",
                "backend": "127.0.0.1:18080",
                "scheme": "http",
                "certificate": "/tmp/ci-check/cert.pem",
                "key": "/tmp/ci-check/key.pem"
              }
            ]
          }
          JSON

      - name: "Validate good config"
        run: /tmp/sonushield validate --config /tmp/ci-check/config.json

      - name: "Validate bad config (must fail)"
        run: |
          cat > /tmp/ci-check/bad.json <<'JSON'
          {
            "proxy": {
              "adminsecret": "ci-admin-secret-value",
              "secrets": { "cookie": "ci-cookie-secret-value" }
            },
            "domains": [
              { "name": "ci.example.com", "backend": "not-a-backend", "scheme": "http" }
            ]
          }
          JSON
          if /tmp/sonushield validate --config /tmp/ci-check/bad.json; then
            echo "validator accepted a bad config" >&2
            exit 1
          fi

      - name: "Validate with backend probe"
        run: |
          python3 -m http.server 18080 --bind 127.0.0.1 >/dev/null 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          /tmp/sonushield validate --config /tmp/ci-check/config.json --probe-backends
