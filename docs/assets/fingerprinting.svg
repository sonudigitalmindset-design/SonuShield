<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="TLS fingerprinting: the ClientHello is fingerprinted and matched against known, bot, and malicious lists">
 <defs>
  <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
  </marker>
  <clipPath id="scanClip"><rect x="340" y="40" width="220" height="200" rx="10"/></clipPath>
  <clipPath id="fp1"><rect x="340" y="92" width="0" height="18"><animate attributeName="width" values="0;220" dur="0.5s" begin="0.55s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></rect></clipPath>
  <clipPath id="fp2"><rect x="340" y="110" width="0" height="18"><animate attributeName="width" values="0;220" dur="0.5s" begin="0.7s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></rect></clipPath>
  <clipPath id="fp3"><rect x="340" y="128" width="0" height="18"><animate attributeName="width" values="0;220" dur="0.5s" begin="0.85s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></rect></clipPath>
  <clipPath id="fp4"><rect x="340" y="146" width="0" height="18"><animate attributeName="width" values="0;220" dur="0.5s" begin="1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></rect></clipPath>
 </defs>
 <rect width="900" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="70" width="190" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <text x="125" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TLS ClientHello</text>
   <text x="125" y="126" text-anchor="middle" font-size="12" fill="#475569">cipher suites</text>
   <text x="125" y="144" text-anchor="middle" font-size="12" fill="#475569">extensions</text>
   <text x="125" y="162" text-anchor="middle" font-size="12" fill="#475569">curves + versions</text>
   <text x="125" y="190" text-anchor="middle" font-size="12" fill="#475569">every TLS client differs</text>
  </g>
  <line x1="222" y1="140" x2="332" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)" stroke-dasharray="110" stroke-dashoffset="110" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="110;0" dur="0.5s" begin="0.5s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="340" y="40" width="220" height="200" rx="10" fill="#0f172a"/>
   <g clip-path="url(#scanClip)">
    <rect x="340" y="10" width="220" height="30" fill="#f59e0b" opacity="0.12">
     <animate attributeName="y" values="10;196" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="340" y="40" width="220" height="14" fill="#f59e0b" opacity="0.35">
     <animate attributeName="y" values="40;226" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
   </g>
   <text x="450" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Fingerprint</text>
   <g clip-path="url(#fp1)"><text x="450" y="104" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b">771,4865-4866-</text></g>
   <g clip-path="url(#fp2)"><text x="450" y="122" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b">4867-49195-49199,</text></g>
   <g clip-path="url(#fp3)"><text x="450" y="140" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b">0-23-65281-10-11,</text></g>
   <g clip-path="url(#fp4)"><text x="450" y="158" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b">29-23-24,0</text></g>
   <text x="450" y="196" text-anchor="middle" font-size="12" fill="#94a3b8" opacity="0">browser + bot identified<animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.25s" fill="freeze"/></text>
   <text x="450" y="216" text-anchor="middle" font-size="12" fill="#94a3b8" opacity="0">from the fingerprint<animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.4s" fill="freeze"/></text>
  </g>
  <line x1="562" y1="140" x2="632" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow3)" stroke-dasharray="70" stroke-dashoffset="70" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.7s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="70;0" dur="0.5s" begin="0.7s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.5s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.5s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="640" y="40" width="230" height="58" rx="10" fill="#ffffff" stroke="#22c55e"/>
   <rect x="640" y="40" width="230" height="58" rx="10" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" values="0.14;0.14;0;0;0.14" keyTimes="0;0.28;0.36;0.94;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <circle cx="662" cy="69" r="8" fill="#22c55e"/>
   <path d="M658 69 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12" stroke-dashoffset="12">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.35s" begin="1.6s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   </path>
   <text x="680" y="65" font-size="14" font-weight="700" fill="#0f172a">Known fingerprints</text>
   <text x="680" y="84" font-size="12" fill="#475569">whitelist real browsers, SEO bots</text>
  </g>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.62s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.62s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="640" y="111" width="230" height="58" rx="10" fill="#ffffff" stroke="#f59e0b"/>
   <rect x="640" y="111" width="230" height="58" rx="10" fill="#f59e0b" opacity="0">
    <animate attributeName="opacity" values="0;0;0.14;0.14;0;0" keyTimes="0;0.3;0.38;0.62;0.7;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <circle cx="662" cy="140" r="8" fill="#f59e0b"/>
   <path d="M658 140 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12" stroke-dashoffset="12">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.35s" begin="1.9s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   </path>
   <text x="680" y="136" font-size="14" font-weight="700" fill="#0f172a">Bot fingerprints</text>
   <text x="680" y="155" font-size="12" fill="#475569">identify bots by name</text>
  </g>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.74s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.74s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="640" y="182" width="230" height="58" rx="10" fill="#ffffff" stroke="#dc2626"/>
   <rect x="640" y="182" width="230" height="58" rx="10" fill="#dc2626" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.14;0.14;0" keyTimes="0;0.62;0.7;0.78;0.94;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <circle cx="662" cy="211" r="8" fill="#dc2626"/>
   <path d="M658 211 l3 3 l5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12" stroke-dashoffset="12">
    <animate attributeName="stroke-dashoffset" values="12;0" dur="0.35s" begin="2.2s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   </path>
   <text x="680" y="207" font-size="14" font-weight="700" fill="#0f172a">Malicious fingerprints</text>
   <text x="680" y="226" font-size="12" fill="#475569">blacklist exploit crawlers</text>
  </g>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#475569" opacity="0">Lists are fetched from this repository at startup. In Cloudflare mode, fingerprinting is unavailable.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
 </g>
</svg>
