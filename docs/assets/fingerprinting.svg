<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="TLS fingerprinting: the ClientHello is fingerprinted and matched against known, bot, and malicious lists">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <clipPath id="scanClip"><rect x="340" y="40" width="220" height="200" rx="10"/></clipPath>
  </defs>
  <rect width="900" height="280" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="30" y="70" width="190" height="140" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="125" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#14263f">TLS ClientHello</text>
      <text x="125" y="126" text-anchor="middle" font-size="12" fill="#57606a">cipher suites</text>
      <text x="125" y="144" text-anchor="middle" font-size="12" fill="#57606a">extensions</text>
      <text x="125" y="162" text-anchor="middle" font-size="12" fill="#57606a">curves + versions</text>
      <text x="125" y="190" text-anchor="middle" font-size="12" fill="#57606a">every TLS client differs</text>
    </g>
    <line x1="222" y1="140" x2="332" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.35s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
    </line>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="340" y="40" width="220" height="200" rx="10" fill="#14263f"/>
      <g clip-path="url(#scanClip)">
        <rect x="340" y="40" width="220" height="14" fill="#f59e0b" opacity="0.35">
          <animate attributeName="y" values="40;226;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/>
        </rect>
      </g>
      <text x="450" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Fingerprint</text>
      <text x="450" y="104" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b" opacity="0">771,4865-4866-<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="450" y="122" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b" opacity="0">4867-49195-49199,<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.62s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="450" y="140" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b" opacity="0">0-23-65281-10-11,<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.74s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="450" y="158" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b" opacity="0">29-23-24,0<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.86s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="450" y="196" text-anchor="middle" font-size="12" fill="#8fa6bd">browser + bot identified</text>
      <text x="450" y="216" text-anchor="middle" font-size="12" fill="#8fa6bd">from the fingerprint</text>
    </g>
    <line x1="562" y1="140" x2="632" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arrow3)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.55s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
    </line>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="640" y="40" width="230" height="58" rx="10" fill="#ffffff" stroke="#22c55e"/>
      <circle cx="662" cy="69" r="8" fill="#22c55e"/>
      <text x="680" y="65" font-size="14" font-weight="700" fill="#14263f">Known fingerprints</text>
      <text x="680" y="84" font-size="12" fill="#57606a">whitelist real browsers, SEO bots</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.62s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.62s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="640" y="111" width="230" height="58" rx="10" fill="#ffffff" stroke="#f59e0b"/>
      <circle cx="662" cy="140" r="8" fill="#f59e0b"/>
      <text x="680" y="136" font-size="14" font-weight="700" fill="#14263f">Bot fingerprints</text>
      <text x="680" y="155" font-size="12" fill="#57606a">identify bots by name</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.74s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.74s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="640" y="182" width="230" height="58" rx="10" fill="#ffffff" stroke="#ef4444"/>
      <circle cx="662" cy="211" r="8" fill="#ef4444"/>
      <text x="680" y="207" font-size="14" font-weight="700" fill="#14263f">Malicious fingerprints</text>
      <text x="680" y="226" font-size="12" fill="#57606a">blacklist exploit crawlers</text>
    </g>
    <text x="450" y="266" text-anchor="middle" font-size="12" fill="#57606a" opacity="0">Lists are fetched from this repository at startup. In Cloudflare mode, fingerprinting is unavailable.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.9s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
  </g>
</svg>
