<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Control-plane schematic: operators sign in to a separate control host, which manages proxy nodes over API v2; visitor traffic goes directly to the nodes">
 <rect width="900" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" opacity="0">SonuShield Control Plane<animate attributeName="opacity" values="0;1" dur="0.7s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -8;0 0" dur="0.7s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/></text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#475569" opacity="0">Schematic — boxes are hosts, arrows are HTTPS requests<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="40" y="90" width="180" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="40" y="90" width="180" height="30" rx="10" fill="#0f172a"/>
   <rect x="40" y="104" width="180" height="16" fill="#0f172a"/>
   <text x="130" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Operator</text>
   <text x="130" y="144" text-anchor="middle" font-size="12" fill="#0f172a">Owner · Reseller · Tenant</text>
   <text x="130" y="164" text-anchor="middle" font-size="12" fill="#475569">Browser, one login</text>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="322" y="70" width="256" height="136" rx="14" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.4s" begin="1s" repeatCount="indefinite"/>
   </rect>
   <rect x="330" y="78" width="240" height="120" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
   <rect x="330" y="78" width="240" height="120" rx="10" fill="#0369a1" opacity="0">
    <animate attributeName="opacity" values="0;0;0.14;0;0" keyTimes="0;0.16;0.22;0.32;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <rect x="330" y="78" width="240" height="30" rx="10" fill="#0f172a"/>
   <rect x="330" y="92" width="240" height="16" fill="#0f172a"/>
   <text x="450" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Control host (separate)</text>
   <text x="450" y="130" text-anchor="middle" font-size="12" fill="#0f172a">Dashboard · Accounts · Audit log</text>
   <text x="450" y="150" text-anchor="middle" font-size="12" fill="#475569">Login lives here only</text>
   <text x="450" y="170" text-anchor="middle" font-size="12" fill="#475569">Never proxies visitor traffic</text>
   <text x="450" y="190" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#0369a1">panel.example.com</text>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="660" y="78" width="200" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="660" y="78" width="200" height="52" rx="10" fill="#0369a1" opacity="0">
    <animate attributeName="opacity" values="0;0;0.14;0;0" keyTimes="0;0.43;0.5;0.62;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <text x="760" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node edge-1</text>
   <text x="760" y="118" text-anchor="middle" font-size="11" fill="#475569">Proxy · API v2 · domains</text>
   <rect x="660" y="146" width="200" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="660" y="146" width="200" height="52" rx="10" fill="#0369a1" opacity="0">
    <animate attributeName="opacity" values="0;0;0.14;0;0" keyTimes="0;0.43;0.5;0.62;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <text x="760" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Node edge-2</text>
   <text x="760" y="186" text-anchor="middle" font-size="11" fill="#475569">Proxy · API v2 · domains</text>
  </g>

  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="40" y="238" width="180" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <text x="130" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Visitors</text>
   <text x="130" y="284" text-anchor="middle" font-size="12" fill="#475569">See nothing of any of this</text>
  </g>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.58s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.58s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="660" y="238" width="200" height="64" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
   <text x="760" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Origin backends</text>
   <text x="760" y="284" text-anchor="middle" font-size="12" fill="#475569">Your sites and apps</text>
  </g>

  <defs>
   <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/>
   </marker>
   <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
   </marker>
  </defs>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
   <line x1="222" y1="138" x2="326" y2="138" stroke="#0369a1" stroke-width="2" stroke-dasharray="104" stroke-dashoffset="104">
    <animate attributeName="stroke-dashoffset" values="104;0" dur="0.5s" begin="0.8s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.25s" begin="1.3s" fill="freeze"/>
   </line>
   <line x1="222" y1="138" x2="326" y2="138" stroke="#0369a1" stroke-width="2" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.3s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.6s" begin="1.3s" repeatCount="indefinite"/>
   </line>
   <polygon points="326,138 316,133 316,143" fill="#0369a1" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.25s" fill="freeze"/></polygon>
   <text x="274" y="126" text-anchor="middle" font-size="11" fill="#0369a1">sign in</text>
   <line x1="572" y1="112" x2="656" y2="104" stroke="#0369a1" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="85" stroke-dashoffset="85"><animate attributeName="stroke-dashoffset" values="85;0" dur="0.5s" begin="0.92s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <line x1="572" y1="164" x2="656" y2="172" stroke="#0369a1" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="85" stroke-dashoffset="85"><animate attributeName="stroke-dashoffset" values="85;0" dur="0.5s" begin="1.04s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <text x="614" y="140" text-anchor="middle" font-size="11" fill="#0369a1">API v2</text>
   <line x1="222" y1="270" x2="656" y2="270" stroke="#475569" stroke-width="2" stroke-dasharray="434" stroke-dashoffset="434">
    <animate attributeName="stroke-dashoffset" values="434;0" dur="0.7s" begin="1.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
    <animate attributeName="opacity" values="1;0" dur="0.25s" begin="1.8s" fill="freeze"/>
   </line>
   <line x1="222" y1="270" x2="656" y2="270" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" begin="1.8s" repeatCount="indefinite"/>
   </line>
   <polygon points="656,270 646,265 646,275" fill="#475569" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.75s" fill="freeze"/></polygon>
   <text x="439" y="258" text-anchor="middle" font-size="11" fill="#475569">visitor traffic — direct, never through the control host</text>
   <line x1="760" y1="200" x2="760" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrG)" stroke-dasharray="34" stroke-dashoffset="34"><animate attributeName="stroke-dashoffset" values="34;0" dur="0.4s" begin="1.2s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
   <circle r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="2">
    <animateMotion dur="8s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.18;1" path="M222 138 H 330"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.3;0.36;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
   </circle>
   <circle r="5" fill="#0369a1">
    <animateMotion dur="8s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.45;1" path="M572 112 L 656 104"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.45;0.52;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
   </circle>
   <circle r="5" fill="#0369a1">
    <animateMotion dur="8s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.45;1" path="M572 164 L 656 172"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.45;0.52;1" dur="8s" begin="1.6s" repeatCount="indefinite"/>
   </circle>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
   <circle r="4" fill="#475569"><animateMotion dur="4s" begin="1.8s" repeatCount="indefinite" path="M222 270 H 656"/></circle>
   <circle r="4" fill="#475569" opacity="0.7"><animateMotion dur="4s" begin="2.5s" repeatCount="indefinite" path="M222 270 H 656"/></circle>
   <circle r="4" fill="#475569" opacity="0.45"><animateMotion dur="4s" begin="3.2s" repeatCount="indefinite" path="M222 270 H 656"/></circle>
  </g>

  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#475569" opacity="0">The proxy stays the source of truth: the control plane keeps no copy of proxy configuration.<animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.4s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
 </g>
</svg>
