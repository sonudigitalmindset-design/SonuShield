<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Control-plane schematic: operators sign in to a separate control host, which manages proxy nodes over API v2; visitor traffic goes directly to the nodes">
  <rect width="900" height="360" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#14263f">SonuShield Control Plane</text>
    <text x="450" y="52" text-anchor="middle" font-size="12" fill="#57606a">Schematic — boxes are hosts, arrows are HTTPS requests</text>

    <!-- Operator -->
    <g>
      <rect x="40" y="90" width="180" height="96" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="40" y="90" width="180" height="30" rx="10" fill="#14263f"/>
      <rect x="40" y="104" width="180" height="16" fill="#14263f"/>
      <text x="130" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe7f3">Operator</text>
      <text x="130" y="144" text-anchor="middle" font-size="12" fill="#14263f">Owner · Reseller · Tenant</text>
      <text x="130" y="164" text-anchor="middle" font-size="12" fill="#57606a">Browser, one login</text>
    </g>

    <!-- Control host -->
    <g>
      <rect x="330" y="78" width="240" height="120" rx="10" fill="#ffffff" stroke="#14263f" stroke-width="2"/>
      <rect x="330" y="78" width="240" height="30" rx="10" fill="#14263f"/>
      <rect x="330" y="92" width="240" height="16" fill="#14263f"/>
      <text x="450" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#dbe7f3">Control host (separate)</text>
      <text x="450" y="130" text-anchor="middle" font-size="12" fill="#14263f">Dashboard · Accounts · Audit log</text>
      <text x="450" y="150" text-anchor="middle" font-size="12" fill="#57606a">Login lives here only</text>
      <text x="450" y="170" text-anchor="middle" font-size="12" fill="#57606a">Never proxies visitor traffic</text>
      <text x="450" y="190" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#4f7fb8">panel.example.com</text>
    </g>

    <!-- Nodes -->
    <g>
      <rect x="660" y="78" width="200" height="52" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="760" y="99" text-anchor="middle" font-size="12" font-weight="700" fill="#14263f">Node edge-1</text>
      <text x="760" y="118" text-anchor="middle" font-size="11" fill="#57606a">Proxy · API v2 · domains</text>
      <rect x="660" y="146" width="200" height="52" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="760" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#14263f">Node edge-2</text>
      <text x="760" y="186" text-anchor="middle" font-size="11" fill="#57606a">Proxy · API v2 · domains</text>
    </g>

    <!-- Visitors -->
    <g>
      <rect x="40" y="238" width="180" height="64" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="130" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#14263f">Visitors</text>
      <text x="130" y="284" text-anchor="middle" font-size="12" fill="#57606a">See nothing of any of this</text>
    </g>
    <g>
      <rect x="660" y="238" width="200" height="64" rx="10" fill="#eef1f4" stroke="#d0d7de"/>
      <text x="760" y="264" text-anchor="middle" font-size="12" font-weight="700" fill="#14263f">Origin backends</text>
      <text x="760" y="284" text-anchor="middle" font-size="12" fill="#57606a">Your sites and apps</text>
    </g>

    <!-- Arrows -->
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f7fb8"/>
      </marker>
      <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
      </marker>
    </defs>
    <line x1="222" y1="138" x2="326" y2="138" stroke="#4f7fb8" stroke-width="2" marker-end="url(#arr)">
      <animate attributeName="stroke-dasharray" values="1,7;7,1" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <text x="274" y="126" text-anchor="middle" font-size="11" fill="#4f7fb8">sign in</text>
    <line x1="572" y1="112" x2="656" y2="104" stroke="#4f7fb8" stroke-width="2" marker-end="url(#arr)"/>
    <line x1="572" y1="164" x2="656" y2="172" stroke="#4f7fb8" stroke-width="2" marker-end="url(#arr)"/>
    <text x="614" y="140" text-anchor="middle" font-size="11" fill="#4f7fb8">API v2</text>
    <line x1="222" y1="270" x2="656" y2="270" stroke="#57606a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrG)"/>
    <text x="439" y="258" text-anchor="middle" font-size="11" fill="#57606a">visitor traffic — direct, never through the control host</text>
    <line x1="760" y1="200" x2="760" y2="234" stroke="#57606a" stroke-width="2" marker-end="url(#arrG)"/>

    <text x="450" y="336" text-anchor="middle" font-size="11" fill="#57606a">The proxy stays the source of truth: the control plane keeps no copy of proxy configuration.</text>
  </g>
</svg>
