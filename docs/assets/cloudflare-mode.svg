<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Cloudflare mode: visitor to Cloudflare to SonuShield on port 80 to backend; TLS fingerprinting unavailable">
 <defs>
  <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
  </marker>
 </defs>
 <rect width="900" height="240" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="75" width="130" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/>
   <circle cx="95" cy="102" r="12" fill="#dbe7f3"/>
   <path d="M77 132 Q95 114 113 132" fill="#dbe7f3"/>
   <text x="95" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a">Visitor</text>
  </g>
  <line x1="162" y1="115" x2="222" y2="115" stroke="#57606a" stroke-width="2" marker-end="url(#arrow6)" stroke-dasharray="60" stroke-dashoffset="60" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="60;0" dur="0.4s" begin="0.5s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="230" y="75" width="180" height="80" rx="10" fill="#ffffff" stroke="#f6821f"/>
   <g>
    <animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-6 0" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="5s" begin="1s" additive="sum" repeatCount="indefinite"/>
    <ellipse cx="320" cy="108" rx="42" ry="20" fill="#f6821f" opacity="0.9"/>
    <ellipse cx="320" cy="102" rx="26" ry="14" fill="#f6821f"/>
   </g>
   <text x="320" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#14263f">Cloudflare</text>
   <text x="320" y="172" text-anchor="middle" font-size="12" fill="#57606a">SSL/TLS: Flexible</text>
  </g>
  <line x1="412" y1="115" x2="472" y2="115" stroke="#57606a" stroke-width="2" marker-end="url(#arrow6)" stroke-dasharray="60" stroke-dashoffset="60" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.62s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="60;0" dur="0.4s" begin="0.62s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
  <text x="442" y="102" text-anchor="middle" font-size="11" font-family="ui-monospace,monospace" fill="#57606a" opacity="0">Cf-Connecting-Ip<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/></text>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="480" y="55" width="200" height="120" rx="10" fill="#14263f"/>
   <text x="580" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">SonuShield</text>
   <text x="580" y="108" text-anchor="middle" font-size="12" fill="#dbe7f3">port 80 only · no certs loaded</text>
   <rect x="496" y="122" width="168" height="26" rx="6" fill="#3a2b12"/>
   <rect x="496" y="122" width="168" height="26" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.42;0.5;0.62;1" dur="4s" begin="1.2s" repeatCount="indefinite"/>
   </rect>
   <text x="580" y="140" text-anchor="middle" font-size="12" fill="#f59e0b">TLS fingerprinting: off</text>
   <text x="580" y="168" text-anchor="middle" font-size="11" fill="#8fa6bd">fingerprint reported as “Cloudflare”</text>
  </g>
  <line x1="682" y1="115" x2="742" y2="115" stroke="#57606a" stroke-width="2" marker-end="url(#arrow6)" stroke-dasharray="60" stroke-dashoffset="60" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.74s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="60;0" dur="0.4s" begin="0.74s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="750" y="75" width="120" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/>
   <rect x="772" y="88" width="76" height="14" rx="4" fill="#dcfce7"/>
   <rect x="772" y="108" width="76" height="14" rx="4" fill="#dcfce7"/>
   <text x="810" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#57606a">Backend</text>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
   <circle r="6" fill="#f6821f"><animateMotion dur="4s" begin="1.2s" repeatCount="indefinite" path="M162 115 H 472 M 682 115 H 742"/></circle>
   <circle r="5" fill="#f6821f" opacity="0.75"><animateMotion dur="4s" begin="1.6s" repeatCount="indefinite" path="M162 115 H 472 M 682 115 H 742"/></circle>
   <circle r="4" fill="#f6821f" opacity="0.5"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M162 115 H 472 M 682 115 H 742"/></circle>
  </g>
  <text x="450" y="212" text-anchor="middle" font-size="12" fill="#57606a" opacity="0">Set <tspan font-family="ui-monospace,monospace">cloudflare: true</tspan> only when actually running behind Cloudflare — enabling it otherwise will not work.<animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
 </g>
</svg>
