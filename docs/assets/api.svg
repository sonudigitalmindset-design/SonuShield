<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="API: a client sends an authenticated request to API v2 and receives JSON statistics">
  <defs>
    <marker id="arrow8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="30" y="60" width="240" height="140" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <text x="150" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#14263f">Your script / dashboard</text>
      <rect x="46" y="100" width="208" height="30" rx="6" fill="#14263f"/>
      <text x="150" y="120" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b">GET_PROXY_STATS</text>
      <text x="150" y="152" text-anchor="middle" font-size="12" fill="#57606a">Header: Proxy-Secret</text>
      <text x="150" y="172" text-anchor="middle" font-size="12" fill="#57606a">(your apisecret)</text>
      <text x="150" y="192" text-anchor="middle" font-size="12" fill="#57606a">v1 also needs adminsecret</text>
    </g>
    <line x1="272" y1="110" x2="352" y2="110" stroke="#57606a" stroke-width="2" marker-end="url(#arrow8)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
    </line>
    <circle r="5" fill="#4f7fb8" opacity="0">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M272 110 H 352"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <line x1="548" y1="150" x2="628" y2="150" stroke="#57606a" stroke-width="2" marker-end="url(#arrow8)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.45s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
    </line>
    <circle r="5" fill="#22c55e" opacity="0">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M548 150 H 628"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="360" y="60" width="180" height="140" rx="10" fill="#14263f"/>
      <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SonuShield API</text>
      <text x="450" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#dbe7f3">/_bProxy/api/v2/</text>
      <text x="450" y="136" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#dbe7f3">&lt;ACTION&gt;</text>
      <text x="450" y="164" text-anchor="middle" font-size="12" fill="#8fa6bd">stats · rules · logs</text>
      <text x="450" y="182" text-anchor="middle" font-size="12" fill="#8fa6bd">monitor + manage</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="636" y="60" width="234" height="140" rx="10" fill="#0d1b2e"/>
      <text x="652" y="88" font-size="12" font-family="ui-monospace,monospace" fill="#7fb3e8" opacity="0">{<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="668" y="108" font-size="12" font-family="ui-monospace,monospace" fill="#c8d6e5" opacity="0">"success": <tspan fill="#22c55e">true</tspan>,<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="668" y="128" font-size="12" font-family="ui-monospace,monospace" fill="#c8d6e5" opacity="0">"results": {<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="684" y="148" font-size="12" font-family="ui-monospace,monospace" fill="#c8d6e5" opacity="0">"CPU_USAGE": 12,<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="684" y="168" font-size="12" font-family="ui-monospace,monospace" fill="#c8d6e5" opacity="0">"RAM_USAGE": 8<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
      <text x="668" y="188" font-size="12" font-family="ui-monospace,monospace" fill="#c8d6e5" opacity="0">}<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    </g>
    <text x="450" y="232" text-anchor="middle" font-size="12" fill="#57606a" opacity="0">Wrong or missing secret? The request falls through to normal proxy handling — no API response is returned.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
  </g>
</svg>
