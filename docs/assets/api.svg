<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="API: a client sends an authenticated request to API v2 and receives JSON statistics">
 <defs>
  <marker id="arrow8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
  </marker>
  <clipPath id="jsonClip"><rect x="636" y="72" width="234" height="0"><animate attributeName="height" values="0;124" dur="1s" begin="0.9s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></rect></clipPath>
 </defs>
 <rect width="900" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="60" width="240" height="140" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <text x="150" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Your script / dashboard</text>
   <rect x="46" y="100" width="208" height="30" rx="6" fill="#0f172a"/>
   <text x="150" y="120" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#f59e0b">GET_PROXY_STATS</text>
   <text x="150" y="152" text-anchor="middle" font-size="12" fill="#475569">Header: Proxy-Secret</text>
   <text x="150" y="172" text-anchor="middle" font-size="12" fill="#475569">(your apisecret)</text>
   <text x="150" y="192" text-anchor="middle" font-size="12" fill="#475569">v1 also needs adminsecret</text>
  </g>
  <line x1="272" y1="110" x2="352" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arrow8)" stroke-dasharray="80" stroke-dashoffset="80" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="80;0" dur="0.4s" begin="0.5s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
  <line x1="548" y1="150" x2="628" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow8)" stroke-dasharray="80" stroke-dashoffset="80" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.65s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="80;0" dur="0.4s" begin="0.65s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="360" y="60" width="180" height="140" rx="10" fill="#0f172a"/>
   <rect x="360" y="60" width="180" height="140" rx="10" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.18;0;0" keyTimes="0;0.18;0.24;0.32;1" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <text x="450" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SonuShield API</text>
   <text x="450" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#e0f2fe">/_bProxy/api/v2/</text>
   <text x="450" y="136" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#e0f2fe">&lt;ACTION&gt;</text>
   <text x="450" y="164" text-anchor="middle" font-size="12" fill="#94a3b8">stats · rules · logs</text>
   <text x="450" y="182" text-anchor="middle" font-size="12" fill="#94a3b8">monitor + manage</text>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.4s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.4s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="636" y="60" width="234" height="140" rx="10" fill="#020617"/>
   <rect x="636" y="60" width="234" height="140" rx="10" fill="#22c55e" opacity="0">
    <animate attributeName="opacity" values="0;0;0.12;0;0" keyTimes="0;0.5;0.56;0.66;1" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <g clip-path="url(#jsonClip)">
    <text x="652" y="88" font-size="12" font-family="ui-monospace,monospace" fill="#38bdf8">{</text>
    <text x="668" y="108" font-size="12" font-family="ui-monospace,monospace" fill="#cbd5e1">"success": <tspan fill="#22c55e">true</tspan>,</text>
    <text x="668" y="128" font-size="12" font-family="ui-monospace,monospace" fill="#cbd5e1">"results": {</text>
    <text x="684" y="148" font-size="12" font-family="ui-monospace,monospace" fill="#cbd5e1">"CPU_USAGE": 12,</text>
    <text x="684" y="168" font-size="12" font-family="ui-monospace,monospace" fill="#cbd5e1">"RAM_USAGE": 8</text>
    <text x="668" y="188" font-size="12" font-family="ui-monospace,monospace" fill="#cbd5e1">}</text>
   </g>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.6s" fill="freeze"/>
   <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#0369a1">
    <animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.2;1" path="M272 110 H 352"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.2;0.26;1" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
   <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#22c55e">
    <animateMotion dur="4.8s" begin="1.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.5;1" path="M548 150 H 628"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.32;0.5;0.56;1" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
   </rect>
  </g>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#475569" opacity="0">Wrong or missing secret? The request falls through to normal proxy handling — no API response is returned.<animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.3s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
 </g>
</svg>
