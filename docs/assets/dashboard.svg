        <rect x="224" y="196" width="200" height="10" rx="5" fill="#f59e0b"><animate attributeName="width" values="200;240;180;200" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" repeatCount="indefinite"/></rect>
        <rect x="224" y="214" width="282" height="10" rx="5" fill="#eef1f4"/>
        <rect x="224" y="214" width="140" height="10" rx="5" fill="#4f7fb8"><animate attributeName="width" values="140;110;160;140" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect>
        <rect x="224" y="232" width="282" height="10" rx="5" fill="#eef1f4"/>
        <rect x="224" y="232" width="90" height="10" rx="5" fill="#4f7fb8"><animate attributeName="width" values="90;120;80;90" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
        <text x="224" y="262" font-size="11" fill="#57606a">Updates every 3 seconds</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
        <rect x="536" y="164" width="308" height="110" rx="8" fill="#ffffff" stroke="#d0d7de"/>
        <text x="550" y="186" font-size="12" font-weight="700" fill="#14263f">Recent requests</text>
        <text x="550" y="206" font-size="11" font-family="ui-monospace,monospace" fill="#57606a">203.0.113.8 · GET / · passed</text>
        <text x="550" y="224" font-size="11" font-family="ui-monospace,monospace" fill="#57606a">198.51.100.4 · GET / · passed</text>
        <text x="550" y="242" font-size="11" font-family="ui-monospace,monospace" fill="#57606a">192.0.2.15 · GET /blog · passed</text>
        <text x="550" y="262" font-size="11" fill="#57606a">Read-only — no changes from the browser</text>
      </g>
    </g>
    <text x="450" y="310" text-anchor="middle" font-size="12" fill="#57606a" opacity="0">Schematic diagram, not a screenshot. Two themes (Premium Dark / Official Classic Light), zero external resources.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.85s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
  </g>
</svg>
