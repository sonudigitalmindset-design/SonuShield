<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Dashboard schematic: sidebar navigation, stat cards, and a dark/light theme switch">
  <rect width="900" height="320" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="40" y="30" width="820" height="260" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="40" y="30" width="820" height="38" rx="10" fill="#14263f"/>
      <rect x="40" y="52" width="820" height="16" fill="#14263f"/>
      <circle cx="62" cy="49" r="6" fill="#ef4444"/>
      <circle cx="82" cy="49" r="6" fill="#f59e0b"/>
      <circle cx="102" cy="49" r="6" fill="#22c55e"/>
      <text x="450" y="53" text-anchor="middle" font-size="13" fill="#dbe7f3">SonuShield Dashboard</text>
      <g>
        <rect x="748" y="38" width="96" height="22" rx="11" fill="#1e3a5c"/>
