          <animate attributeName="cx" values="760;760;832;832;760" keyTimes="0;0.35;0.5;0.85;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="8s" repeatCount="indefinite"/>
        </circle>
        <text x="792" y="53" text-anchor="middle" font-size="10" fill="#8fa6bd">Dark · Light</text>
      </g>
      <rect x="40" y="68" width="150" height="222" fill="#f0f3f6"/>
      <rect x="40" y="68" width="150" height="222" fill="none" stroke="#d0d7de"/>
      <text x="56" y="94" font-size="13" font-weight="700" fill="#14263f">Overview</text>
      <text x="56" y="120" font-size="13" fill="#57606a">Domains</text>
