      <text x="56" y="172" font-size="13" fill="#57606a">Stage</text>
      <text x="56" y="198" font-size="13" fill="#57606a">Logs</text>
      <text x="56" y="224" font-size="13" fill="#57606a">About</text>
      <g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
          <rect x="210" y="84" width="150" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
          <text x="224" y="106" font-size="11" fill="#57606a">TOTAL RPS</text>
          <text x="224" y="132" font-size="22" font-weight="700" fill="#14263f">1,240</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
          <rect x="376" y="84" width="150" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
          <text x="390" y="106" font-size="11" fill="#57606a">BYPASSED RPS</text>
          <text x="390" y="132" font-size="22" font-weight="700" fill="#14263f">86</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
          <rect x="542" y="84" width="150" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
          <text x="556" y="106" font-size="11" fill="#57606a">STAGE</text>
          <text x="556" y="132" font-size="22" font-weight="700" fill="#f59e0b">2</text>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
          <rect x="708" y="84" width="136" height="64" rx="8" fill="#ffffff" stroke="#d0d7de"/>
          <text x="722" y="106" font-size="11" fill="#57606a">CPU / RAM</text>
          <text x="722" y="132" font-size="22" font-weight="700" fill="#14263f">12% / 8%</text>
        </g>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.55s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
        <rect x="210" y="164" width="310" height="110" rx="8" fill="#ffffff" stroke="#d0d7de"/>
        <text x="224" y="186" font-size="12" font-weight="700" fill="#14263f">Top IPs</text>
