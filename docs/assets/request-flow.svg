<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Request flow: visitor requests pass through SonuShield challenges to the backend; blocked bots are stopped">
 <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
  </marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
  </marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
  </marker>
  <clipPath id="shieldClip"><rect x="360" y="40" width="180" height="150" rx="10"/></clipPath>
 </defs>
 <rect width="900" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="45" width="120" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <circle cx="90" cy="70" r="12" fill="#e0f2fe"/>
   <path d="M72 100 Q90 82 108 100" fill="#e0f2fe"/>
   <text x="90" y="130" text-anchor="middle" font-size="13" fill="#475569" font-weight="600">Real visitor</text>
  </g>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="155" width="120" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="68" y="172" width="44" height="30" rx="6" fill="#fef2f2"/>
   <circle cx="80" cy="184" r="3" fill="#dc2626"/><circle cx="100" cy="184" r="3" fill="#dc2626"/>
   <text x="90" y="240" text-anchor="middle" font-size="13" fill="#475569" font-weight="600">Bot / attacker</text>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="360" y="40" width="180" height="150" rx="10" fill="#0f172a"/>
   <text x="450" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SonuShield</text>
   <rect x="376" y="80" width="148" height="24" rx="6" fill="#1e293b"/>
   <text x="450" y="96" text-anchor="middle" font-size="12" fill="#e0f2fe">TLS fingerprint</text>
   <rect x="376" y="110" width="148" height="24" rx="6" fill="#1e293b"/>
   <text x="450" y="126" text-anchor="middle" font-size="12" fill="#e0f2fe">Firewall rules</text>
   <rect x="376" y="140" width="148" height="24" rx="6" fill="#f59e0b"/>
   <text x="450" y="156" text-anchor="middle" font-size="12" fill="#020617" font-weight="700">Challenge (stage 1–3)</text>
   <g clip-path="url(#shieldClip)">
    <rect x="360" y="74" width="180" height="30" fill="#ffffff" opacity="0">
     <animate attributeName="y" values="74;74;104;104;134;134;74" keyTimes="0;0.22;0.33;0.55;0.66;0.88;1" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
     <animate attributeName="opacity" values="0;0.14;0.14;0.14;0.14;0.14;0" keyTimes="0;0.08;0.22;0.66;0.8;0.88;1" dur="4.8s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
   </g>
  </g>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="750" y="45" width="120" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="772" y="58" width="76" height="14" rx="4" fill="#dcfce7"/>
   <rect x="772" y="78" width="76" height="14" rx="4" fill="#dcfce7"/>
   <text x="810" y="130" text-anchor="middle" font-size="13" fill="#475569" font-weight="600">Your backend</text>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.58s" fill="freeze"/>
   <rect x="560" y="155" width="150" height="70" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="440" stroke-dashoffset="440">
    <animate attributeName="stroke-dashoffset" values="440;0" dur="0.8s" begin="0.58s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   </rect>
   <rect x="560" y="155" width="150" height="70" rx="10" fill="none" stroke="#dc2626" stroke-dasharray="5 4" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0.35;1;1" keyTimes="0;0.55;0.62;0.75;1" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
   </rect>
   <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 4;0 0;0 0" keyTimes="0;0.55;0.6;0.68;1" dur="4.8s" begin="2.4s" additive="sum" repeatCount="indefinite"/>
    <text x="635" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">✕ Blocked</text>
   </g>
   <text x="635" y="204" text-anchor="middle" font-size="12" fill="#475569" opacity="0">rate-limited / susLv ≥ 4<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/></text>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.7s" fill="freeze"/>
   <line x1="150" y1="80" x2="352" y2="80" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="202" stroke-dashoffset="202"><animate attributeName="stroke-dashoffset" values="202;0" dur="0.5s" begin="0.7s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <line x1="540" y1="80" x2="742" y2="80" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)" stroke-dasharray="202" stroke-dashoffset="202"><animate attributeName="stroke-dashoffset" values="202;0" dur="0.5s" begin="0.85s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <line x1="150" y1="190" x2="352" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="202" stroke-dashoffset="202"><animate attributeName="stroke-dashoffset" values="202;0" dur="0.5s" begin="0.95s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <path d="M 450 190 V 210 H 560" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="170" stroke-dashoffset="170"><animate attributeName="stroke-dashoffset" values="170;0" dur="0.5s" begin="1.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></path>
   <path d="M 560 210 L 550 205 L 550 215 Z" fill="#dc2626" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.55s" fill="freeze"/></path>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
   <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#22c55e"><animateMotion dur="3.2s" begin="1.2s" repeatCount="indefinite" path="M150 80 H 360 M 540 80 H 750"/></rect>
   <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#22c55e" opacity="0.75"><animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M150 80 H 360 M 540 80 H 750"/></rect>
   <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#22c55e" opacity="0.5"><animateMotion dur="3.2s" begin="2s" repeatCount="indefinite" path="M150 80 H 360 M 540 80 H 750"/></rect>
   <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#dc2626"><animateMotion dur="3.2s" begin="2.8s" repeatCount="indefinite" path="M150 190 H 355"/></rect>
   <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#dc2626" opacity="0.6"><animateMotion dur="3.2s" begin="3.4s" repeatCount="indefinite" path="M150 190 H 355"/></rect>
  </g>
    <text x="645" y="102" font-size="12" fill="#22c55e" font-weight="600" opacity="0">passed
   <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.7;0.9;1" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
   <animateTransform attributeName="transform" type="translate" values="0 4;0 4;0 0;0 0;0 4" keyTimes="0;0.62;0.7;0.9;1" dur="3.2s" begin="1.2s" additive="sum" repeatCount="indefinite"/>
  </text>
 </g>
</svg>
