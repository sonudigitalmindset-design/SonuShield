<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Request flow: visitor requests pass through SonuShield challenges to the backend; blocked bots are stopped">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
    <path id="pGood" d="M150 80 H 360 M 540 80 H 750" fill="none"/>
    <path id="pBad" d="M150 190 H 360" fill="none"/>
  </defs>
  <rect width="900" height="260" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="30" y="45" width="120" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <circle cx="90" cy="70" r="12" fill="#dbe7f3"/>
      <path d="M72 100 Q90 82 108 100" fill="#dbe7f3"/>
      <text x="90" y="130" text-anchor="middle" font-size="13" fill="#57606a" font-weight="600">Real visitor</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.22s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.22s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="30" y="155" width="120" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="68" y="172" width="44" height="30" rx="6" fill="#fde8e8"/>
      <circle cx="80" cy="184" r="3" fill="#ef4444"/><circle cx="100" cy="184" r="3" fill="#ef4444"/>
      <text x="90" y="240" text-anchor="middle" font-size="13" fill="#57606a" font-weight="600">Bot / attacker</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.34s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.34s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="360" y="40" width="180" height="150" rx="10" fill="#14263f"/>
      <text x="450" y="68" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">SonuShield</text>
      <rect x="376" y="80" width="148" height="24" rx="6" fill="#1e3a5c"/>
      <text x="450" y="96" text-anchor="middle" font-size="12" fill="#dbe7f3">TLS fingerprint</text>
      <rect x="376" y="110" width="148" height="24" rx="6" fill="#1e3a5c"/>
      <text x="450" y="126" text-anchor="middle" font-size="12" fill="#dbe7f3">Firewall rules</text>
      <rect x="376" y="140" width="148" height="24" rx="6" fill="#f59e0b">
        <animate attributeName="opacity" values="1;0.8;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="450" y="156" text-anchor="middle" font-size="12" fill="#0d1b2e" font-weight="700">Challenge (stage 1–3)</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.46s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.46s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="750" y="45" width="120" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
      <rect x="772" y="58" width="76" height="14" rx="4" fill="#dcfce7"/>
      <rect x="772" y="78" width="76" height="14" rx="4" fill="#dcfce7"/>
      <text x="810" y="130" text-anchor="middle" font-size="13" fill="#57606a" font-weight="600">Your backend</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.58s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.58s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="560" y="155" width="150" height="70" rx="10" fill="#ffffff" stroke="#ef4444" stroke-dasharray="5 4"/>
      <text x="635" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#ef4444">✕ Blocked</text>
      <text x="635" y="204" text-anchor="middle" font-size="12" fill="#57606a">rate-limited / susLv ≥ 4</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <line x1="150" y1="80" x2="352" y2="80" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="540" y1="80" x2="742" y2="80" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
      <line x1="150" y1="190" x2="352" y2="190" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M 450 190 V 210 H 560" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
    </g>
    <circle r="5" fill="#22c55e" opacity="0">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M150 80 H 360 M 540 80 H 750"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" fill="#ef4444" opacity="0">
      <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M150 190 H 355"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="645" y="102" font-size="12" fill="#22c55e" font-weight="600" opacity="0">passed<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.85s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
  </g>
</svg>
