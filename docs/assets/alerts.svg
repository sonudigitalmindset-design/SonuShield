<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Discord DDoS alert: an embed with total and allowed requests per second, plus a traffic chart when the attack ends">
 <defs>
  <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
   <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
  </marker>
  <path id="chartPath" d="M344,220 L400,206 L456,214 L512,180 L568,196 L624,168 L680,186 L736,158 L792,176 L846,150" fill="none"/>
 </defs>
 <rect width="900" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="60" width="220" height="160" rx="10" fill="#0f172a"/>
   <text x="140" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Attack detected</text>
   <text x="140" y="118" text-anchor="middle" font-size="12" fill="#94a3b8">stage 1 being bypassed</text>
   <g>
    <rect x="60" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;74;40;40;40;40" keyTimes="0;0.12;0.28;0.5;0.75;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;116;150;150;150;150" keyTimes="0;0.12;0.28;0.5;0.75;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="94" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;40;74;40;40;40" keyTimes="0;0.2;0.32;0.48;0.75;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;150;116;150;150;150" keyTimes="0;0.2;0.32;0.48;0.75;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="128" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;40;40;74;40;40" keyTimes="0;0.35;0.45;0.55;0.7;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;150;150;116;150;150" keyTimes="0;0.35;0.45;0.55;0.7;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="162" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;40;40;74;40;40" keyTimes="0;0.52;0.62;0.72;0.84;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;150;150;116;150;150" keyTimes="0;0.52;0.62;0.72;0.84;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect>
    <rect x="196" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;40;40;40;74;40" keyTimes="0;0.65;0.75;0.85;0.95;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;150;150;150;116;150" keyTimes="0;0.65;0.75;0.85;0.95;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="5s" begin="0.8s" repeatCount="indefinite"/></rect>
   </g>
   <text x="140" y="208" text-anchor="middle" font-size="12" fill="#94a3b8">requests / second</text>
  </g>
  <line x1="252" y1="140" x2="312" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow4)" stroke-dasharray="60" stroke-dashoffset="60" opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
   <animate attributeName="stroke-dashoffset" values="60;0" dur="0.4s" begin="0.5s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
  </line>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.9s" fill="freeze"/>
   <circle r="5" fill="#5865f2"><animateMotion dur="2s" begin="0.9s" repeatCount="indefinite" path="M252 140 H 312"/></circle>
   <circle r="4" fill="#5865f2" opacity="0.6"><animateMotion dur="2s" begin="1.4s" repeatCount="indefinite" path="M252 140 H 312"/></circle>
  </g>
    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="320" y="40" width="550" height="200" rx="10" fill="#0f172a"/>
   <rect x="320" y="40" width="6" height="200" rx="3" fill="#5865f2"/>
   <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
    <circle cx="356" cy="72" r="14" fill="#5865f2"/>
    <text x="356" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">S</text>
    <text x="380" y="70" font-size="14" font-weight="700" fill="#ffffff">SonuShield</text>
    <text x="380" y="88" font-size="12" fill="#cbd5e1">DDoS Alert</text>
   </g>
   <circle cx="846" cy="68" r="7" fill="#dc2626"/>
   <circle cx="846" cy="68" r="7" fill="none" stroke="#dc2626" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;20" dur="2s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" begin="1s" repeatCount="indefinite"/>
   </circle>
   <circle cx="846" cy="68" r="7" fill="none" stroke="#dc2626" stroke-width="2" opacity="0">
    <animate attributeName="r" values="7;20" dur="2s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2s" begin="2s" repeatCount="indefinite"/>
   </circle>
   <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.75s" fill="freeze"/>
    <rect x="344" y="102" width="502" height="56" rx="8" fill="#1e293b"/>
    <text x="360" y="126" font-size="13" fill="#e2e8f0">Attack detected on example.com</text>
    <text x="360" y="146" font-size="12" fill="#cbd5e1">Total RPS: 1,240 · Allowed RPS: 86</text>
   </g>
   <polyline points="344,220 400,206 456,214 512,180 568,196 624,168 680,186 736,158 792,176 846,150" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" values="700;0;0" keyTimes="0;0.55;1" calcMode="spline" keySplines=".22 1 .36 1;0 0 1 1" dur="6s" begin="1s" repeatCount="indefinite"/>
   </polyline>
   <circle r="8" fill="#f59e0b" opacity="0">
    <animateMotion dur="6s" begin="1s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.55;1"><mpath href="#chartPath"/></animateMotion>
    <animate attributeName="opacity" values="0;0.3;0.3;0;0" keyTimes="0;0.05;0.5;0.58;1" dur="6s" begin="1s" repeatCount="indefinite"/>
   </circle>
   <circle r="4" fill="#f59e0b" opacity="0">
    <animateMotion dur="6s" begin="1s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.55;1"><mpath href="#chartPath"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.5;0.58;1" dur="6s" begin="1s" repeatCount="indefinite"/>
   </circle>
   <text x="344" y="234" font-size="11" fill="#94a3b8" opacity="0">Traffic chart is included when the attack ends, with peak request rates.<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/></text>
  </g>
  <text x="450" y="266" text-anchor="middle" font-size="12" fill="#475569" opacity="0">Sent only when the stage is not locked: when stage 1 starts being bypassed, and when the attack ends. Configure a Discord webhook per domain.<animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.2s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
 </g>
</svg>
