<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Discord DDoS alert: an embed with total and allowed requests per second, plus a traffic chart when the attack ends">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="280" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="30" y="60" width="220" height="160" rx="10" fill="#14263f"/>
      <text x="140" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Attack detected</text>
      <text x="140" y="118" text-anchor="middle" font-size="12" fill="#8fa6bd">stage 1 being bypassed</text>
      <g>
        <rect x="60" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;70;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="150;120;150" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="94" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;86;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="y" values="150;104;150" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect>
        <rect x="128" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;62;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="y" values="150;128;150" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect>
        <rect x="162" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;78;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="150;112;150" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.6s" repeatCount="indefinite"/></rect>
        <rect x="196" y="150" width="26" height="40" rx="3" fill="#f59e0b"><animate attributeName="height" values="40;66;40" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="150;124;150" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="3s" begin="0.8s" repeatCount="indefinite"/></rect>
      </g>
      <text x="140" y="208" text-anchor="middle" font-size="12" fill="#8fa6bd">requests / second</text>
    </g>
    <line x1="252" y1="140" x2="312" y2="140" stroke="#57606a" stroke-width="2" marker-end="url(#arrow4)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
    </line>
    <circle r="5" fill="#5865f2" opacity="0">
      <animateMotion dur="2s" repeatCount="indefinite" path="M252 140 H 312"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/>
      <rect x="320" y="40" width="550" height="200" rx="10" fill="#1e1f22"/>
      <rect x="320" y="40" width="6" height="200" rx="3" fill="#5865f2"/>
      <circle cx="356" cy="72" r="14" fill="#5865f2"/>
      <text x="356" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">S</text>
      <text x="380" y="70" font-size="14" font-weight="700" fill="#ffffff">SonuShield</text>
      <text x="380" y="88" font-size="12" fill="#b5bac1">DDoS Alert</text>
      <circle cx="846" cy="68" r="7" fill="#ef4444"><animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/></circle>
      <rect x="344" y="102" width="502" height="56" rx="8" fill="#2b2d31"/>
      <text x="360" y="126" font-size="13" fill="#dbdee1">Attack detected on example.com</text>
      <text x="360" y="146" font-size="12" fill="#b5bac1">Total RPS: 1,240 · Allowed RPS: 86</text>
      <polyline points="344,220 400,206 456,214 512,180 568,196 624,168 680,186 736,158 792,176 846,150" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="700" stroke-dashoffset="700">
        <animate attributeName="stroke-dashoffset" values="700;0;0" keyTimes="0;0.55;1" calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1" dur="5.5s" repeatCount="indefinite"/>
      </polyline>
      <text x="344" y="234" font-size="11" fill="#949ba4">Traffic chart is included when the attack ends, with peak request rates.</text>
    </g>
    <text x="450" y="266" text-anchor="middle" font-size="12" fill="#57606a" opacity="0">Sent only when the stage is not locked: when stage 1 starts being bypassed, and when the attack ends. Configure a Discord webhook per domain.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
  </g>
</svg>
