      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700" opacity="0">Brotli &amp; Image Optimization<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="50" y="95" width="220" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="160" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700">Origin bytes</text><text x="160" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a">HTML / image</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="340" y="95" width="220" height="80" rx="10" fill="#14263f" stroke="#d0d7de"/><text x="450" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">Optimize</text><text x="450" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#7fb3e8">Brotli · resize</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="630" y="95" width="220" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x