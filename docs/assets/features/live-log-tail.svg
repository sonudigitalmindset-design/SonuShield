<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Live Log Tail (SSE) — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700" opacity="0">Live Log Tail (SSE)<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <rect x="90" y="85" width="720" height="64" rx="10" fill="#0d1b2e"/><clipPath id="typeclip-live-log-tail"><rect x="110" y="95" width="0" height="44"><animate attributeName="width" values="0;680;680;0" keyTimes="0;0.55;0.85;1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect></clipPath><text x="110" y="124" font-size="16" font-family="ui-monospace,monospace" fill="#22c55e" clip-path="url(#typeclip-live-log-tail)">block 203.0.113.10 /wp-login.php …</text><rect x="112" y="100" width="9" height="26" fill="#22c55e"><animate attributeName="x" values="112;782;782;112" keyTimes="0;0.55;0.85;1" dur="6s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;1;1;0;1" keyTimes="0;0.55;0.62;0.69;0.76;0.83;1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect><text x="450" y="185" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">SSE · role/SSO auth · bounded · sanitized<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">Schematic: log lines stream to the dashboard over server-sent events.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
  </g>
