<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Cloudflare Mode — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700" opacity="0">Cloudflare Mode<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="50" y="95" width="220" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="160" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700">Visitor</text><text x="160" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569">via Cloudflare</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="340" y="95" width="220" height="80" rx="10" fill="#0f172a" stroke="#e2e8f0"/><text x="450" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">SonuShield :80</text><text x="450" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0284c7">no TLS certs</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="630" y="95" width="220" height="80" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="740" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700">Origin</text><text x="740" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569">backend</text></g><line x1="275" y1="135" x2="332" y2="135" stroke="#0369a1" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><circle r="5" fill="#0369a1" opacity="0"><animateMotion dur="1.8s" begin="0.7s" repeatCount="indefinite" path="M 275 135 L 332 135"/><animate attributeName="opacity" values="0;1.0;1.0;0" keyTimes="0;0.08;0.92;1" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></circle><line x1="565" y1="135" x2="622" y2="135" stroke="#0369a1" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.65s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><circle r="5" fill="#0369a1" opacity="0"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite" path="M 565 135 L 622 135"/><animate attributeName="opacity" values="0;1.0;1.0;0" keyTimes="0;0.08;0.92;1" dur="1.8s" begin="1.1s" repeatCount="indefinite"/></circle><text x="450" y="200" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Cf-Connecting-Ip · CF-IPCountry<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Schematic: Cloudflare terminates TLS — the proxy reads the real IP from its headers.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
  </g>
