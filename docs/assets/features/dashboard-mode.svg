<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Dashboard Mode — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700" opacity="0">Dashboard Mode<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <circle cx="450" cy="128" r="58" fill="#0f172a"/><circle cx="450" cy="128" r="70" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 450 128" to="360 450 128" dur="10.0s" repeatCount="indefinite"/></circle><text x="450" y="136" text-anchor="middle" font-size="17" font-family="ui-monospace,monospace" fill="#ffffff" font-weight="700" opacity="0">local<animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0.0;0.167;0.333;0.5;0.667;0.833;1.0" dur="6.0s" begin="0.0s" repeatCount="indefinite"/></text><text x="450" y="136" text-anchor="middle" font-size="17" font-family="ui-monospace,monospace" fill="#ffffff" font-weight="700" opacity="0">control-plane<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0.0;0.167;0.333;0.5;0.667;0.833;1.0" dur="6.0s" begin="0.0s" repeatCount="indefinite"/></text><text x="450" y="136" text-anchor="middle" font-size="17" font-family="ui-monospace,monospace" fill="#ffffff" font-weight="700" opacity="0">off<animate attributeName="opacity" values="0;0;0;0;0;1;1" keyTimes="0.0;0.167;0.333;0.5;0.667;0.833;1.0" dur="6.0s" begin="0.0s" repeatCount="indefinite"/></text><text x="450" y="215" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">proxy.dashboardMode<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Schematic: local, control-plane, or off — one key decides where management lives.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
  </g>
</svg>
