    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="50" y="100" width="220" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="160" y="130" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700">request</text><text x="160" y="152" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a">visitor sees: generic</text></g><line x1="275" y1="135" x2="340" y2="135" stroke="#57606a" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.45s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.45s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><polygon points="450,80 540,135 450,190 360,135" fill="#14263f" stroke="#14263f"/><text x="450" y="131" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">quietMode: true</text><text x="450" y="149" text-anchor="middle" font-size="11" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#7fb3e8">decides</text></g><path d="M 540 135 C 600 135, 610 95, 660 95" fill="none" stroke="#15803d" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.7s" fill="fre