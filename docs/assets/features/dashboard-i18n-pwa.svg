<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Dashboard Hindi / English &amp; PWA — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700" opacity="0">Dashboard Hindi / English &amp; PWA<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="270" y="70" width="170" height="40" rx="9" fill="#0f172a"><animate attributeName="opacity" values="0.9;0.25;0.9" keyTimes="0;0.5;1" dur="5.0s" begin="0.6s" repeatCount="indefinite"/></rect><text x="355" y="95" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">English</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.22s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.22s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="460" y="70" width="170" height="40" rx="9" fill="#0f172a"><animate attributeName="opacity" values="0.25;0.9;0.25" keyTimes="0;0.5;1" dur="5.0s" begin="0.6s" repeatCount="indefinite"/></rect><text x="545" y="95" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">हिन्दी</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="200" y="126" width="500" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0"/></g><text x="450" y="164" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" opacity="0">English content<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="5.0s" begin="0.6s" repeatCount="indefinite"/></text><text x="450" y="164" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" opacity="0">हिन्दी content<animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="5.0s" begin="0.6s" repeatCount="indefinite"/></text><text x="450" y="212" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">456 keys each · shell-only service worker<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Schematic: one UI, two languages — installable as an app shell.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
