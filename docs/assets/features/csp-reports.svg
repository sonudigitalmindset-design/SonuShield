0;0" keyTimes="0;0.08;0.92;1" dur="2.8s" begin="1.0499999999999998s" repeatCount="indefinite"/></circle><circle r="4" fill="#0369a1" opacity="0"><animateMotion dur="2.8s" begin="1.4s" repeatCount="indefinite" path="M 620 92 L 450 188"/><animate attributeName="opacity" values="0;1.0;1.0;0" keyTimes="0;0.08;0.92;1" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle><text x="450" y="212" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">stored (200/domain)   ·   overflow dropped<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
