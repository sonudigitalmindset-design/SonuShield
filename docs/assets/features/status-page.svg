<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Status Page &amp; Health Endpoint — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700" opacity="0">Status Page &amp; Health Endpoint<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <circle cx="450" cy="128" r="58" fill="#14263f"/><circle cx="450" cy="128" r="70" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 450 128" to="360 450 128" dur="10.0s" repeatCount="indefinite"/></circle><text x="450" y="136" text-anchor="middle" font-size="17" font-family="ui-monospace,monospace" fill="#ffffff" font-weight="700" opacity="0">{&quot;status&quot;:&quot;ok&quot;}<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="4.0s" begin="0.0s" repeatCount="indefinite"/></text><text x="450" y="136" text-anchor="middle" font-size="17" font-family="ui-monospace,monospace" fill="#ffffff" font-weight="700" opacity="0">{&quot;status&quot;:…,&quot;stage&quot;:…,&quot;uptime&quot;:…}<animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0.0;0.25;0.5;0.75;1.0" dur="4.0s" begin="0.0s" repeatCount="indefinite"/></text><text x="450" y="215" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">/_bProxy/health · /_bProxy/status<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">Schematic: three keys for status, one key for health — nothing more.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
  </g>
