<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Tarpit — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700" opacity="0">Tarpit<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="60" y="100" width="200" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="160" y="130" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700">request</text><text x="160" y="152" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569">blocked anyway</text></g><line x1="265" y1="135" x2="350" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><circle cx="450" cy="135" r="48" fill="#ffffff" stroke="#0f172a" stroke-width="3"/><line x1="450" y1="135" x2="450" y2="103" stroke="#0f172a" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 450 135" to="360 450 135" dur="12s" repeatCount="indefinite"/></line><line x1="450" y1="135" x2="472" y2="135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 450 135" to="360 450 135" dur="3s" repeatCount="indefinite"/></line><circle cx="450" cy="135" r="4" fill="#0f172a"/><text x="450" y="203" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">delay: up to 30 s<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text><circle cx="430" cy="60" r="4" fill="#0369a1" opacity="0"><animate attributeName="cy" values="60;84;60" keyTimes="0;0.6;1" dur="3s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.65" dur="3s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="450" cy="60" r="4" fill="#0369a1" opacity="0"><animate attributeName="cy" values="60;84;60" keyTimes="0;0.6;1" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.65" dur="3s" begin="0.5s" repeatCount="indefinite"/></circle><circle cx="470" cy="60" r="4" fill="#0369a1" opacity="0"><animate attributeName="cy" values="60;84;60" keyTimes="0;0.6;1" dur="3s" begin="1.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2;0.65" dur="3s" begin="1.0s" repeatCount="indefinite"/></circle><line x1="505" y1="135" x2="590" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="595" y="100" width="245" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="717" y="130" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700">block answer</text><text x="717" y="152" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569">after the delay · 64 concurrent</text></g>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Schematic: the response drips slowly while a semaphore bounds concurrency.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
  </g>
</svg>
