<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Post-Quantum TLS (X25519MLKEM768) — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700" opacity="0">Post-Quantum TLS (X25519MLKEM768)<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="50" y="95" width="210" height="80" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="155" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700">Client</text><text x="155" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a">browser · bot · curl</text></g><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="640" y="95" width="210" height="80" rx="10" fill="#14263f" stroke="#d0d7de"/><text x="745" y="125" text-anchor="middle" font-size="14" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">SonuShield</text><text x="745" y="147" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#7fb3e8">SonuShield proxy</text></g><line x1="265" y1="120" x2="635" y2="120" stroke="#4f7fb8" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><text x="450" y="108" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#4f7fb8" opacity="0">ClientHello + PQ share<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text><line x1="635" y1="152" x2="265" y2="152" stroke="#15803d" stroke-width="2" marker-end="url(#arr)" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.55s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></line><text x="450" y="172" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#15803d" opacity="0">TLS 1.3 · PQ<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.65s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.65s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text><circle r="5" fill="#4f7fb8" opacity="0"><animateMotion dur="2.6s" begin="0.6s" repeatCount="indefinite" path="M 265 120 L 635 120"/><animate attributeName="opacity" values="0;1.0;1.0;0" keyTimes="0;0.08;0.92;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle><circle r="5" fill="#22c55e" opacity="0"><animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite" path="M 635 152 L 265 152"/><animate attributeName="opacity" values="0;1.0;1.0;0" keyTimes="0;0.08;0.92;1" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></circle><g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.8s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/><rect x="360" y="190" width="132" height="28" rx="14" fill="#14263f" stroke="#14263f"/><text x="426" y="209" text-anchor="middle" font-size="12" font-family="ui-monospace,monospace" fill="#ffffff">X25519MLKEM768</text></g>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">Schematic: the hybrid key exchange runs inside the normal TLS 1.3 handshake.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
