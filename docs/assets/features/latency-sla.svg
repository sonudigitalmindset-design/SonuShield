<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Latency / TTFB &amp; SLA — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700" opacity="0">Latency / TTFB &amp; SLA<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <line x1="90" y1="60" x2="90" y2="195" stroke="#57606a" stroke-width="1.5"/><line x1="90" y1="195" x2="820" y2="195" stroke="#57606a" stroke-width="1.5"/><path d="M 90 170 C 200 165, 260 150, 340 120 S 500 60, 580 88 S 730 150, 820 130" fill="none" stroke="#4f7fb8" stroke-width="3" stroke-dasharray="800" stroke-dashoffset="800"><animate attributeName="stroke-dashoffset" values="800;0;0" keyTimes="0;0.55;1" calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1" dur="5.0s" begin="0.3s" repeatCount="indefinite"/></path><circle r="6" fill="#f59e0b" opacity="0"><animateMotion dur="5.0s" begin="0.3s" repeatCount="indefinite" path="M 90 170 C 200 165, 260 150, 340 120 S 500 60, 580 88 S 730 150, 820 130"/><animate attributeName="opacity" values="0;1.0;1.0;0" keyTimes="0;0.08;0.92;1" dur="5.0s" begin="0.3s" repeatCount="indefinite"/></circle><line x1="90" y1="105" x2="820" y2="105" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.8"/><text x="815" y="96" text-anchor="end" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ef4444" opacity="0">p50 · p95 · p99<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text><text x="120" y="80" text-anchor="start" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#14263f" font-weight="700" opacity="0">TTFB percentiles<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text><text x="450" y="218" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">proxy vs origin split<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.5s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#57606a" opacity="0">Schematic: proxy time and origin time measured separately — p50 / p95 / p99.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
