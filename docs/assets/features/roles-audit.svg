    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Schematic: every action checks a role, then writes an audit entry — no exceptions.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
