<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Visual Rule Builder — schematic animation">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="30" y="34" text-anchor="start" font-size="16" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700" opacity="0">Visual Rule Builder<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.0;0.175;0.85;1" dur="4.5s" begin="0.2s" repeatCount="indefinite"/><rect x="220" y="175" width="460" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="450" y="197" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700">field</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.425;0.85;1" dur="4.5s" begin="0.2s" repeatCount="indefinite"/><rect x="240" y="133" width="420" height="34" rx="8" fill="#ffffff" stroke="#e2e8f0"/><text x="450" y="155" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#0f172a" font-weight="700">operator</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.675;0.85;1" dur="4.5s" begin="0.2s" repeatCount="indefinite"/><rect x="260" y="91" width="380" height="34" rx="8" fill="#0f172a" stroke="#e2e8f0"/><text x="450" y="113" text-anchor="middle" font-size="13" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#ffffff" font-weight="700">value</text></g><text x="450" y="212" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">expression preview<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.4s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
    <text x="450" y="236" text-anchor="middle" font-size="12" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" fill="#475569" opacity="0">Schematic: pick field, operator, value — the builder emits only valid expressions.<animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.8s" begin="0.6s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" additive="sum" fill="freeze"/></text>
  </g>
</svg>
