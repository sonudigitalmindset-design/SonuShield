<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="SonuShield request pipeline schematic: visitor to TLS listener, fingerprinting, rules and stage machine, then challenge, edge cache, or backend pool">
 <rect width="900" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <text x="450" y="34" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a" opacity="0">SonuShield Request Pipeline<animate attributeName="opacity" values="0;1" dur="0.7s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 -8;0 0" dur="0.7s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/></text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#475569" opacity="0">Schematic — one process, in-memory state, config.json on disk<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="90" width="130" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="30" y="90" width="130" height="30" rx="10" fill="#0f172a"/>
   <rect x="30" y="104" width="130" height="16" fill="#0f172a"/>
   <text x="95" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Visitor</text>
   <text x="95" y="144" text-anchor="middle" font-size="12" fill="#0f172a">Browser · Bot</text>
   <text x="95" y="164" text-anchor="middle" font-size="12" fill="#475569">Untrusted input</text>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.22s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="200" y="90" width="150" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="200" y="90" width="150" height="30" rx="10" fill="#0f172a"/>
   <rect x="200" y="104" width="150" height="16" fill="#0f172a"/>
   <rect x="200" y="90" width="150" height="30" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.16;0.22;0.3;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
   <text x="275" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">TLS Listener</text>
   <text x="275" y="144" text-anchor="middle" font-size="12" fill="#0f172a">SNI cert select</text>
   <text x="275" y="164" text-anchor="middle" font-size="12" fill="#475569">:443 · :80 redirect</text>
  </g>

  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.34s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="390" y="90" width="160" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="390" y="90" width="160" height="30" rx="10" fill="#0f172a"/>
   <rect x="390" y="104" width="160" height="16" fill="#0f172a"/>
   <rect x="390" y="90" width="160" height="30" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.38;0.44;0.52;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
   <text x="470" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Fingerprinting</text>
   <text x="470" y="144" text-anchor="middle" font-size="12" fill="#0f172a">TLS · JA4 · sh1 · H2</text>
   <text x="470" y="164" text-anchor="middle" font-size="12" fill="#475569">Geo · Reputation · Risk</text>
  </g>

  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.46s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="590" y="90" width="150" height="96" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
   <rect x="590" y="90" width="150" height="30" rx="10" fill="#0f172a"/>
   <rect x="590" y="104" width="150" height="16" fill="#0f172a"/>
   <rect x="590" y="90" width="150" height="30" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;0;0.25;0;0" keyTimes="0;0.6;0.66;0.74;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
   <text x="665" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#e0f2fe">Rules + Stage</text>
   <text x="665" y="144" text-anchor="middle" font-size="12" fill="#0f172a">Edge · Firewall · WAF</text>
   <text x="665" y="164" text-anchor="middle" font-size="12" fill="#475569">Suspicion 0–4</text>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.58s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 16;0 0" dur="0.7s" begin="0.58s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="200" y="250" width="150" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="200" y="250" width="150" height="72" rx="10" fill="#f59e0b" opacity="0"><animate attributeName="opacity" values="0;0.1;0;0;0" keyTimes="0;0.12;0.24;0.6;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
   <text x="275" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Challenge</text>
   <text x="275" y="298" text-anchor="middle" font-size="11" fill="#475569">Cookie · PoW · Captcha</text>
   <rect x="390" y="250" width="160" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="390" y="250" width="160" height="72" rx="10" fill="#0369a1" opacity="0"><animate attributeName="opacity" values="0;0;0;0.1;0;0" keyTimes="0;0.3;0.42;0.54;0.66;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
   <text x="470" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Edge Cache</text>
   <text x="470" y="298" text-anchor="middle" font-size="11" fill="#475569">GET · explicit freshness</text>
   <rect x="590" y="250" width="150" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <rect x="590" y="250" width="150" height="72" rx="10" fill="#22c55e" opacity="0"><animate attributeName="opacity" values="0;0;0.14;0;0" keyTimes="0;0.78;0.84;0.92;1" dur="6s" begin="1.8s" repeatCount="indefinite"/></rect>
   <text x="665" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Backend Pool</text>
   <text x="665" y="298" text-anchor="middle" font-size="11" fill="#475569">Health · Failover · WS</text>
   <rect x="780" y="250" width="90" height="72" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <text x="825" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Origin</text>
   <text x="825" y="298" text-anchor="middle" font-size="11" fill="#475569">Your site</text>
  </g>

    <g stroke="#94a3b8" stroke-width="1.5" fill="none">
   <line x1="160" y1="138" x2="196" y2="138" stroke-dasharray="36" stroke-dashoffset="36"><animate attributeName="stroke-dashoffset" values="36;0" dur="0.4s" begin="0.8s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <polygon points="196,138 186,133 186,143" fill="#94a3b8" stroke="none" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.15s" fill="freeze"/></polygon>
   <line x1="350" y1="138" x2="386" y2="138" stroke-dasharray="36" stroke-dashoffset="36"><animate attributeName="stroke-dashoffset" values="36;0" dur="0.4s" begin="0.92s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <polygon points="386,138 376,133 376,143" fill="#94a3b8" stroke="none" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.27s" fill="freeze"/></polygon>
   <line x1="550" y1="138" x2="586" y2="138" stroke-dasharray="36" stroke-dashoffset="36"><animate attributeName="stroke-dashoffset" values="36;0" dur="0.4s" begin="1.04s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <polygon points="586,138 576,133 576,143" fill="#94a3b8" stroke="none" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.39s" fill="freeze"/></polygon>
   <line x1="665" y1="186" x2="665" y2="246" stroke-dasharray="60" stroke-dashoffset="60"><animate attributeName="stroke-dashoffset" values="60;0" dur="0.4s" begin="1.16s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <polygon points="665,246 660,236 670,236" fill="#94a3b8" stroke="none" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.51s" fill="freeze"/></polygon>
   <line x1="550" y1="286" x2="586" y2="286" stroke-dasharray="36" stroke-dashoffset="36"><animate attributeName="stroke-dashoffset" values="36;0" dur="0.4s" begin="1.28s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <polygon points="586,286 576,281 576,291" fill="#94a3b8" stroke="none" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.63s" fill="freeze"/></polygon>
   <line x1="740" y1="286" x2="776" y2="286" stroke-dasharray="36" stroke-dashoffset="36"><animate attributeName="stroke-dashoffset" values="36;0" dur="0.4s" begin="1.4s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></line>
   <polygon points="776,286 766,281 766,291" fill="#94a3b8" stroke="none" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.75s" fill="freeze"/></polygon>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/>
   <circle r="11" fill="#f59e0b" opacity="0.25">
    <animateMotion dur="6s" begin="1.8s" repeatCount="indefinite" path="M95 138 H 665 V 286 H 825"/>
    <animate attributeName="opacity" values="0;0.25;0.25;0" keyTimes="0;0.04;0.96;1" dur="6s" begin="1.8s" repeatCount="indefinite"/>
   </circle>
   <circle r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2">
    <animateMotion dur="6s" begin="1.8s" repeatCount="indefinite" path="M95 138 H 665 V 286 H 825"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.96;1" dur="6s" begin="1.8s" repeatCount="indefinite"/>
   </circle>
  </g>

    <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.82s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="-24 0;0 0" dur="0.7s" begin="0.82s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="30" y="356" width="400" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <text x="230" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Control plane (separate host) — dashboard, accounts, audit log</text>
   <text x="230" y="396" text-anchor="middle" font-size="11" fill="#475569">Manages nodes over API v2 · never sees visitor traffic</text>
  </g>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.94s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="24 0;0 0" dur="0.7s" begin="0.94s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="470" y="356" width="400" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
   <text x="670" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">State: memory only · config.json · no database</text>
   <text x="670" y="396" text-anchor="middle" font-size="11" fill="#475569">Reload discards caches · nodes share no state</text>
  </g>
 </g>
</svg>
