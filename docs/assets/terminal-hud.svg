<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal HUD schematic: live CPU, domain, stage, request rates, and latest logs with a command prompt">
  <rect width="900" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="40" y="28" width="820" height="244" rx="10" fill="#0d1b2e"/>
    <circle cx="62" cy="46" r="6" fill="#ef4444"/>
    <circle cx="82" cy="46" r="6" fill="#f59e0b"/>
    <circle cx="102" cy="46" r="6" fill="#22c55e"/>
    <text x="450" y="50" text-anchor="middle" font-size="13" fill="#8fa6bd">./main — SonuShield</text>
    <line x1="40" y1="62" x2="860" y2="62" stroke="#243b57"/>
    <text x="60" y="90" font-size="13" fill="#7fb3e8">Cpu Usage: <tspan fill="#ffffff">12%</tspan>   Domain: <tspan fill="#ffffff">example.com</tspan>   Stage: <tspan fill="#f59e0b">2</tspan>   Stage Locked: <tspan fill="#ffffff">false</tspan></text>
    <text x="60" y="114" font-size="13" fill="#7fb3e8">Total: <tspan fill="#ffffff">1,240 /s</tspan>   Bypassed: <tspan fill="#ffffff">86 /s</tspan></text>
    <g>
      <rect x="60" y="128" width="360" height="12" rx="6" fill="#1e3a5c"/>
      <rect x="60" y="128" width="240" height="12" rx="6" fill="#f59e0b"><animate attributeName="width" values="240;320;200;240" dur="4s" repeatCount="indefinite"/></rect>
      <text x="432" y="139" font-size="11" fill="#8fa6bd">total RPS</text>
      <rect x="60" y="148" width="360" height="12" rx="6" fill="#1e3a5c"/>
      <rect x="60" y="148" width="40" height="12" rx="6" fill="#22c55e"><animate attributeName="width" values="40;64;32;40" dur="4s" begin="0.5s" repeatCount="indefinite"/></rect>
      <text x="432" y="159" font-size="11" fill="#8fa6bd">bypassed RPS</text>
    </g>
    <text x="60" y="188" font-size="13" fill="#7fb3e8">Latest Logs:</text>
    <text x="60" y="208" font-size="12" fill="#c8d6e5">203.0.113.8    GET /          Chromium   allowed</text>
    <text x="60" y="226" font-size="12" fill="#c8d6e5">198.51.100.4  GET /blog      Firefox    allowed</text>
    <text x="60" y="244" font-size="12" fill="#c8d6e5">192.0.2.15    GET /wp-login  unknown    captcha</text>
    <text x="60" y="264" font-size="13" fill="#f59e0b">sonushield&gt; <tspan fill="#ffffff">stage 2</tspan><tspan fill="#f59e0b"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite">▌</animate></tspan></text>
  </g>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#57606a">Schematic diagram, not a screenshot. Commands: help · stage · domain · add · clrlogs · reload</text>
</svg>
