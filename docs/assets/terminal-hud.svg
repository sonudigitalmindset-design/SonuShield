<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal HUD schematic: live CPU, domain, stage, request rates, and latest logs with a command prompt">
  <rect width="900" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.1s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <rect x="40" y="28" width="820" height="244" rx="10" fill="#0d1b2e"/>
      <circle cx="62" cy="46" r="6" fill="#ef4444"/>
      <circle cx="82" cy="46" r="6" fill="#f59e0b"/>
      <circle cx="102" cy="46" r="6" fill="#22c55e"/>
      <text x="450" y="50" text-anchor="middle" font-size="13" fill="#8fa6bd">./main — SonuShield</text>
      <line x1="40" y1="62" x2="860" y2="62" stroke="#243b57"/>
    </g>
    <text x="60" y="90" font-size="13" fill="#7fb3e8" opacity="0">Cpu Usage: <tspan fill="#ffffff">12%</tspan>   Domain: <tspan fill="#ffffff">example.com</tspan>   Stage: <tspan fill="#f59e0b">2</tspan>   Stage Locked: <tspan fill="#ffffff">false</tspan><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.25s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    <text x="60" y="114" font-size="13" fill="#7fb3e8" opacity="0">Total: <tspan fill="#ffffff">1,240 /s</tspan>   Bypassed: <tspan fill="#ffffff">86 /s</tspan><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.35s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.45s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/>
      <rect x="60" y="128" width="360" height="12" rx="6" fill="#1e3a5c"/>
      <rect x="60" y="128" width="240" height="12" rx="6" fill="#f59e0b"><animate attributeName="width" values="240;320;200;240" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="432" y="139" font-size="11" fill="#8fa6bd">total RPS</text>
      <rect x="60" y="148" width="360" height="12" rx="6" fill="#1e3a5c"/>
      <rect x="60" y="148" width="40" height="12" rx="6" fill="#22c55e"><animate attributeName="width" values="40;64;32;40" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1" dur="6s" begin="0.5s" repeatCount="indefinite"/></rect>
      <text x="432" y="159" font-size="11" fill="#8fa6bd">bypassed RPS</text>
    </g>
    <text x="60" y="188" font-size="13" fill="#7fb3e8" opacity="0">Latest Logs:<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.55s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    <text x="60" y="208" font-size="12" fill="#c8d6e5" opacity="0">203.0.113.8    GET /          Chromium   allowed<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.65s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    <text x="60" y="226" font-size="12" fill="#c8d6e5" opacity="0">198.51.100.4  GET /blog      Firefox    allowed<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.75s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    <text x="60" y="244" font-size="12" fill="#c8d6e5" opacity="0">192.0.2.15    GET /wp-login  unknown    captcha<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.85s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
    <text x="60" y="264" font-size="13" fill="#f59e0b" opacity="0">sonushield&gt; <tspan fill="#ffffff">stage 2</tspan><tspan fill="#f59e0b">▌<animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.06s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.95s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
  </g>
  <text x="450" y="292" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#57606a" opacity="0">Schematic diagram, not a screenshot. Commands: help · stage · domain · add · clrlogs · reload<animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.05s" calcMode="spline" keyTimes="0;1" keySplines="0.22 1 0.36 1" fill="freeze"/></text>
</svg>
