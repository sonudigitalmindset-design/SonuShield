<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal HUD schematic: live CPU, domain, stage, request rates, and latest logs with a command prompt">
 <defs>
  <clipPath id="promptClip"><rect x="60" y="250" width="0" height="20"><animate attributeName="width" values="0;200" dur="0.7s" begin="1.2s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></rect></clipPath>
 </defs>
 <rect width="900" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
 <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <animateTransform attributeName="transform" type="translate" values="0 10;0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/>
   <rect x="40" y="28" width="820" height="244" rx="10" fill="#020617"/>
   <circle cx="62" cy="46" r="6" fill="#dc2626"/>
   <circle cx="82" cy="46" r="6" fill="#f59e0b"/>
   <circle cx="102" cy="46" r="6" fill="#22c55e"/>
   <text x="450" y="50" text-anchor="middle" font-size="13" fill="#94a3b8">./main — SonuShield</text>
   <line x1="40" y1="62" x2="860" y2="62" stroke="#334155"/>
  </g>
  <text x="60" y="90" font-size="13" fill="#38bdf8" opacity="0">Cpu Usage: <tspan fill="#ffffff">12%</tspan>   Domain: <tspan fill="#ffffff">example.com</tspan>   Stage: <tspan fill="#f59e0b">2</tspan>   Stage Locked: <tspan fill="#ffffff">false</tspan><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.25s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
  <text x="60" y="114" font-size="13" fill="#38bdf8" opacity="0">Total: <tspan fill="#ffffff">1,240 /s</tspan>   Bypassed: <tspan fill="#ffffff">86 /s</tspan><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.35s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/><animate attributeName="opacity" values="1;1;0.55;1;1" keyTimes="0;0.3;0.36;0.42;1" dur="6s" begin="1.4s" repeatCount="indefinite"/></text>
  <g opacity="0">
   <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.45s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/>
   <rect x="60" y="128" width="360" height="12" rx="6" fill="#1e293b"/>
   <rect x="60" y="128" width="240" height="12" rx="6" fill="#f59e0b"><animate attributeName="width" values="240;320;200;240" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
   <circle cy="134" r="4" fill="#f59e0b" stroke="#020617" stroke-width="1.5"><animate attributeName="cx" values="300;380;260;300" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
   <text x="432" y="139" font-size="11" fill="#94a3b8">total RPS</text>
   <rect x="60" y="148" width="360" height="12" rx="6" fill="#1e293b"/>
   <rect x="60" y="148" width="40" height="12" rx="6" fill="#22c55e"><animate attributeName="width" values="40;64;32;40" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect>
   <circle cy="154" r="4" fill="#22c55e" stroke="#020617" stroke-width="1.5"><animate attributeName="cx" values="100;124;92;100" keyTimes="0;0.33;0.66;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1" dur="6s" begin="1.5s" repeatCount="indefinite"/></circle>
   <text x="432" y="159" font-size="11" fill="#94a3b8">bypassed RPS</text>
  </g>
  <text x="60" y="188" font-size="13" fill="#38bdf8" opacity="0">Latest Logs:<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.55s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
    <g font-size="12" fill="#cbd5e1">
   <text x="60" y="226" opacity="0">203.0.113.8    GET /          Chromium   allowed<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="0.65s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 0;0 0;0 -18;0 -18" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="0.65s" additive="sum" repeatCount="indefinite"/></text>
   <text x="60" y="226" opacity="0">198.51.100.4  GET /blog      Firefox    allowed<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="3.65s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 0;0 0;0 -18;0 -18" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="3.65s" additive="sum" repeatCount="indefinite"/></text>
   <text x="60" y="226" opacity="0">192.0.2.15    GET /wp-login  unknown    captcha<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="6.65s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 0;0 0;0 -18;0 -18" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="6.65s" additive="sum" repeatCount="indefinite"/></text>
   <text x="60" y="226" opacity="0">203.0.113.9   GET /api       curl       blocked<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="9.65s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 0;0 0;0 -18;0 -18" keyTimes="0;0.15;0.7;0.85;1" dur="12s" begin="9.65s" additive="sum" repeatCount="indefinite"/></text>
  </g>
  <g clip-path="url(#promptClip)">
   <text x="60" y="264" font-size="13" fill="#f59e0b">sonushield&gt; <tspan fill="#ffffff">stage 2</tspan><tspan fill="#f59e0b">▌<animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.06s" repeatCount="indefinite"/></tspan></text>
  </g>
 </g>
 <text x="450" y="292" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="12" fill="#475569" opacity="0">Schematic diagram, not a screenshot. Commands: help · stage · domain · add · clrlogs · reload<animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.4s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/></text>
</svg>
