<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SonuShield — lightweight HTTP anti-DDoS reverse proxy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <path id="flow1" d="M 60 250 C 300 200, 500 290, 760 240 S 1080 200, 1160 230" fill="none"/>
    <path id="flow2" d="M 40 90 C 260 130, 520 60, 780 100 S 1080 130, 1170 95" fill="none"/>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <g fill="none" stroke="#243b57" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" opacity="0.35"/>
  </g>
  <use href="#flow1" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35"/>
  <use href="#flow2" stroke="#4f7fb8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35"/>
  <circle r="5" fill="#f59e0b">
    <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion>
  </circle>
  <circle r="4" fill="#7fb3e8">
    <animateMotion dur="9s" begin="1.2s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion>
  </circle>
  <circle r="4" fill="#f59e0b" opacity="0.8">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion>
  </circle>
  <g transform="translate(96,58)">
    <circle cx="78" cy="96" r="96" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.25">
      <animate attributeName="r" values="88;102;88" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.1;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M78 6 L148 34 V96 C148 146 118 178 78 198 C38 178 8 146 8 96 V34 Z" fill="url(#shield)" opacity="0.95"/>
    <path d="M52 96 L72 118 L108 74" fill="none" stroke="#0d1b2e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="300" y="140" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">SonuShield</text>
  <text x="302" y="182" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="24" fill="#c8d6e5">Lightweight HTTP anti-DDoS reverse proxy</text>
  <text x="302" y="216" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" fill="#8fa6bd">TLS fingerprinting · staged challenges · live dashboard</text>
  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="600">
    <rect x="302" y="240" width="118" height="30" rx="15" fill="#1e3a5c"/>
    <text x="361" y="260" text-anchor="middle" fill="#dbe7f3">Go 1.24</text>
    <rect x="432" y="240" width="118" height="30" rx="15" fill="#1e3a5c"/>
    <text x="491" y="260" text-anchor="middle" fill="#dbe7f3">GPL-3.0</text>
    <rect x="562" y="240" width="170" height="30" rx="15" fill="#1e3a5c"/>
    <text x="647" y="260" text-anchor="middle" fill="#dbe7f3">Single binary</text>
  </g>
</svg>
