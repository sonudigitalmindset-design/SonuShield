 <text x="302" y="182" font-size="24" fill="#cbd5e1" opacity="0">Lightweight HTTP anti-DDoS reverse proxy<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.9s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="0.7s" begin="0.9s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/></text>
 <text x="302" y="216" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" fill="#94a3b8" opacity="0">TLS fingerprinting · staged challenges · live dashboard<animate attributeName="opacity" values="0;1" dur="0.7s" begin="1.05s" calcMode="spline" keySplines=".22 1 .36 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-20 0;0 0" dur="0.7s" begin="1.05s" calcMode="spline" keySplines=".22 1 .36 1" additive="sum" fill="freeze"/></text>
